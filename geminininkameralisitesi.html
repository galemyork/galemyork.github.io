<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Ekran Ultra Ayna</title>
    <style>
        /* Ekranın tamamını kullanalım */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            flex-direction: column;
        }

        .mirror-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            /* Görüntüyü boşluk kalmadan ekrana yayar */
            object-fit: cover;
            /* Keskinlik ayarları */
            image-rendering: -webkit-optimize-contrast;
        }

        /* Ön kamera için ayna efekti sınıfı */
        .mirror-mode {
            transform: scaleX(-1);
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
            font-weight: bold;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">Yükleniyor...</div>

    <div class="mirror-container">
        <video id="mirrorVideo" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button onclick="setupCamera('user')">Ön Kamera</button>
        <button onclick="setupCamera('environment')">Arka Kamera</button>
    </div>

    <script>
        let currentStream = null;

        async function setupCamera(mode) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            // Ekran boyutlarını alarak en yüksek uyumu sağlıyoruz
            const screenW = window.screen.width;
            const screenH = window.screen.height;

            const constraints = {
                video: {
                    facingMode: mode,
                    // Sabit rakam yerine ekranın maksimumunu hedefliyoruz
                    width: { ideal: 4096 }, 
                    height: { ideal: 2160 },
                    frameRate: { ideal: 120, min: 60 }
                },
                audio: false
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                const video = document.getElementById('mirrorVideo');
                video.srcObject = currentStream;

                // Ayna efekti kontrolü
                if (mode === 'user') {
                    video.classList.add('mirror-mode');
                } else {
                    video.classList.remove('mirror-mode');
                }

                // Bilgi güncelleme
                const settings = currentStream.getVideoTracks()[0].getSettings();
                document.getElementById('info').innerText = 
                    `${settings.width}x${settings.height} @ ${Math.round(settings.frameRate)}FPS`;

            } catch (err) {
                console.error("Kamera hatası:", err);
                // Hata durumunda en temel ayarlara dön
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('mirrorVideo').srcObject = fallback;
            }
        }

        // İlk açılış
        window.addEventListener('load', () => setupCamera('user'));
    </script>
</body>
</html>
