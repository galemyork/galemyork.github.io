<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anlık Fotoğraf Yansıtma</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        #video {
            display: none; 
        }

        #canvas {
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transform: scaleX(-1); 
        }

        h2 {
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h2>Anlık Fotoğrafınız</h2>

    <div class="controls">
        <button onclick="startCamera('4K')">4K 120 FPS Başlat</button>
        <button onclick="startCamera('HD')">HD 1 FPS Başlat</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        let currentStream = null;

        function startCamera(mode) {
            // Eğer halihazırda çalışan bir kamera varsa durdur
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            let constraints;

            if (mode === '4K') {
                constraints = {
                    video: {
                        width: { ideal: 3840 },
                        height: { ideal: 2160 },
                        frameRate: { ideal: 120 }
                    },
                    audio: false
                };
            } else {
                constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { exact: 1 } // Tam olarak 1 FPS
                    },
                    audio: false
                };
            }

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    currentStream = stream;
                    video.srcObject = stream;
                    
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        setTimeout(takePhoto, 1000); 
                    };
                })
                .catch(err => {
                    console.error("Kamera hatası:", err);
                    alert("Seçilen modda kameraya erişilemedi. Donanımınız bu kare hızını veya çözünürlüğü desteklemiyor olabilir.");
                });
        }

        function takePhoto() {
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            // Akışı otomatik durdurmak isterseniz aşağıdaki satırı aktif bırakın
            // if(currentStream) currentStream.getTracks().forEach(track => track.stop());
        }
    </script>
</body>
</html>
