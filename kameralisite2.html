<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kamera Önizleme</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

video {
  width: 100%;
  height: auto;
  background: #000;
  transition: transform 0.2s ease;
}

.controls {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  background: #111;
}

button {
  padding: 10px 14px;
  font-size: 16px;
  background: #222;
  color: #fff;
  border: none;
  border-radius: 6px;
}

.active {
  background: #007bff;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<div class="controls">
  <button onclick="startCamera()">📷 Başlat</button>
  <button onclick="toggleCamera()">🔄 Kamera</button>
  <button onclick="setZoom(1)" id="z1">1×</button>
  <button onclick="setZoom(2)" id="z2">2×</button>
  <button onclick="setZoom(3)" id="z3">3×</button>
</div>

<script>
let stream = null;
let facingMode = "environment";
let zoomLevel = 1;

async function startCamera() {
  if (stream) return;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode },
      audio: false
    });

    document.getElementById("camera").srcObject = stream;
    applyZoom(zoomLevel);
    applyMirror();

  } catch (e) {
    alert("Kamera izni verilmedi veya HTTPS yok");
    console.error(e);
  }
}

function toggleCamera() {
  if (!stream) return;

  stream.getTracks().forEach(t => t.stop());
  stream = null;
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
}

function setZoom(level) {
  zoomLevel = level;
  updateButtons();
  applyZoom(level);
}

function applyZoom(level) {
  if (!stream) return;

  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities();

  if (caps.zoom) {
    track.applyConstraints({ advanced: [{ zoom: level }] });
    document.getElementById("camera").style.transform = "scale(1)";
  } else {
    document.getElementById("camera").style.transform = `scale(${level})`;
  }
}

function applyMirror() {
  const video = document.getElementById("camera");
  if (facingMode === "user") {
    video.style.transform = `scaleX(-1) scale(${zoomLevel})`;
  }
}

function updateButtons() {
  ["z1","z2","z3"].forEach(id =>
    document.getElementById(id).classList.remove("active")
  );
  document.getElementById("z" + zoomLevel).classList.add("active");
}
</script>

</body>
</html>
